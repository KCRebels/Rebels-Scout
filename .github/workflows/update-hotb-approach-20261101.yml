name: Update Scout Decision and ABA through Nov 1, 2026

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-hotb-approach-20261101.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update Decision and ABA metrics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast
          p=Path('scripts/inject_hotb_stats.py')
          src=p.read_text(encoding='utf-8')
          tree=ast.parse(src)
          assign=next(n for n in tree.body if isinstance(n,ast.Assign) and any(isinstance(t,ast.Name) and t.id=='PLAYERS' for t in n.targets))
          players=ast.literal_eval(assign.value)
          vals={
            'aniesa-rohleder': ('87%',107,{'GOOD':93,'MINOR':1,'POOR':13,'NOT_SCORED':14},'88%',24,{'GOOD':21,'MINOR':0,'POOR':3},'96%',12,{'GOOD':11,'MINOR':1,'POOR':0}),
            'brooklyn-gering': ('91%',59,{'GOOD':53,'MINOR':1,'POOR':5,'NOT_SCORED':13},'89%',18,{'GOOD':16,'MINOR':0,'POOR':2},'83%',6,{'GOOD':5,'MINOR':0,'POOR':1}),
            'brynna-peter': ('77%',55,{'GOOD':42,'MINOR':1,'POOR':12,'NOT_SCORED':19},'67%',18,{'GOOD':12,'MINOR':0,'POOR':6},'100%',6,{'GOOD':6,'MINOR':0,'POOR':0}),
            'claire-jack': ('94%',33,{'GOOD':31,'MINOR':0,'POOR':2,'NOT_SCORED':0},'88%',8,{'GOOD':7,'MINOR':0,'POOR':1},'100%',4,{'GOOD':4,'MINOR':0,'POOR':0}),
            'hailey-marsh': ('100%',47,{'GOOD':47,'MINOR':0,'POOR':0,'NOT_SCORED':43},'100%',24,{'GOOD':24,'MINOR':0,'POOR':0},'100%',8,{'GOOD':8,'MINOR':0,'POOR':0}),
            'lakyn-farley': ('78%',50,{'GOOD':39,'MINOR':0,'POOR':11,'NOT_SCORED':20},'71%',7,{'GOOD':5,'MINOR':0,'POOR':2},'90%',10,{'GOOD':9,'MINOR':0,'POOR':1}),
            'lydia-copeland': ('80%',61,{'GOOD':48,'MINOR':1,'POOR':12,'NOT_SCORED':9},'73%',15,{'GOOD':11,'MINOR':0,'POOR':4},'92%',13,{'GOOD':12,'MINOR':0,'POOR':1}),
            'maia-waddell': ('100%',36,{'GOOD':36,'MINOR':0,'POOR':0,'NOT_SCORED':35},'100%',24,{'GOOD':24,'MINOR':0,'POOR':0},'100%',4,{'GOOD':4,'MINOR':0,'POOR':0}),
            'makenna-whitaker': ('79%',50,{'GOOD':39,'MINOR':1,'POOR':10,'NOT_SCORED':9},'81%',16,{'GOOD':13,'MINOR':0,'POOR':3},'100%',6,{'GOOD':6,'MINOR':0,'POOR':0}),
            'maleah-pena': ('75%',46,{'GOOD':32,'MINOR':5,'POOR':9,'NOT_SCORED':4},'67%',15,{'GOOD':10,'MINOR':0,'POOR':5},'100%',6,{'GOOD':6,'MINOR':0,'POOR':0}),
            'matti-hardy': ('72%',76,{'GOOD':53,'MINOR':3,'POOR':20,'NOT_SCORED':9},'62%',21,{'GOOD':13,'MINOR':0,'POOR':8},'91%',11,{'GOOD':10,'MINOR':0,'POOR':1}),
            'megan-ryan': ('87%',53,{'GOOD':45,'MINOR':2,'POOR':6,'NOT_SCORED':15},'67%',18,{'GOOD':12,'MINOR':0,'POOR':6},'100%',9,{'GOOD':9,'MINOR':0,'POOR':0}),
            'tayte-stepps': ('81%',50,{'GOOD':40,'MINOR':1,'POOR':9,'NOT_SCORED':21},'76%',17,{'GOOD':13,'MINOR':0,'POOR':4},'67%',6,{'GOOD':4,'MINOR':0,'POOR':2}),
          }
          for slug,v in vals.items():
              h=players[slug]['h']
              h.update(decisionPct=v[0],decisionN=v[1],decisionCounts=v[2],firstPct=v[3],firstN=v[4],firstCounts=v[5],twoPct=v[6],twoN=v[7],twoCounts=v[8])
          lines=src.splitlines(); start=assign.lineno-1; end=assign.end_lineno
          lines[start:end]=['PLAYERS='+repr(players)]
          p.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
          python scripts/inject_hotb_stats.py
      - name: Verify and commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/inject_hotb_stats.py */index.html
          git diff --cached --check
          git commit -m "Update Scout Decision and ABA through Nov 1" || exit 0
          git push
