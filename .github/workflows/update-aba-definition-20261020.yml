name: Update ABA definition

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-aba-definition-20261020.yml'

permissions:
  contents: write

jobs:
  update-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clarify ABA wording across player pages and generator
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          definition = ('ABA measures how well a hitter executes the right approach in two key situations: '
                        'the first pitch and with two strikes. 1P evaluates whether the hitter’s first-pitch '
                        'decision matches the hitting plan and pitch location. 2K evaluates how well the hitter '
                        'adjusts to protect the plate and compete once the count reaches two strikes. Because the '
                        'goal changes with the count, what qualifies as a good approach changes too.')

          anchor="aba:()=>head('AT-BAT APPROACH','ABA')+'"
          replacement=anchor+'<p>'+definition+'</p>'
          changed=[]
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts or p.suffix.lower() not in {'.html','.py','.js'}:
                  continue
              try:
                  text=p.read_text(encoding='utf-8')
              except Exception:
                  continue
              if anchor in text and definition not in text:
                  p.write_text(text.replace(anchor,replacement),encoding='utf-8')
                  changed.append(str(p))
          print('Changed:', *changed, sep='\n')
          if not changed:
              raise SystemExit('No Scout ABA popup copies found')
          PY
      - name: Commit ABA wording
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Clarify ABA definition across Scout'
          git push
