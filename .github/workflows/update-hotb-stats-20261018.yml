name: Update Rebels Scout stats from Oct 18 HotB backup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-hotb-stats-20261018.yml"

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh all player performance stats
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/inject_hotb_stats.py')
          s=p.read_text(encoding='utf-8')
          old=",lambda m,k=key:m.group(1)+p[k]+m.group(2),1)"
          new=",lambda m,k=key:m.group(1)+p[k]+m.group(2))"
          if old not in s:
              raise SystemExit('Expected pitching updater pattern not found')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
          python scripts/inject_hotb_stats.py
      - name: Commit refreshed player pages
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aniesa-rohleder/index.html brooklyn-gering/index.html brynna-peter/index.html claire-jack/index.html hailey-marsh/index.html lakyn-farley/index.html lydia-copeland/index.html maia-waddell/index.html makenna-whitaker/index.html maleah-pena/index.html matti-hardy/index.html megan-ryan/index.html tayte-stepps/index.html
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No stat changes needed"
          else
            git commit -m "Refresh Rebels Scout stats from Oct 18 HotB backup"
            git push
          fi
