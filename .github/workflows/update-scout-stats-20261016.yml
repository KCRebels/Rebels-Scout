name: Update Rebels Scout stats once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-scout-stats-20261016.yml"

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update player stat tiles
        run: python tools/update_scout_stats_20261016.py
      - name: Commit updated pages
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aniesa-rohleder/index.html brooklyn-gering/index.html brynna-peter/index.html claire-jack/index.html hailey-marsh/index.html lakyn-farley/index.html lydia-copeland/index.html maia-waddell/index.html makenna-whitaker/index.html maleah-pena/index.html matti-hardy/index.html megan-ryan/index.html tayte-stepps/index.html
          git diff --cached --check
          git commit -m "Update Rebels Scout stats from Oct 16 HotB backup"
          git push
