name: Update Rebels Scout stats

on:
  push:
    paths:
      - '.github/workflows/update-rebels-scout-stats.yml'

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update player stat tiles
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          S={
          'aniesa-rohleder':(17,'90%','94%','94%','17%','.462','.588','6%',70,[63,0,7,1],16,[15,0,1],8,[7,1,0],['17%','8%','1.000','1.000']),
          'brooklyn-gering':(11,'82%','80%','83%','43%','.300','.364','27%',31,[25,1,5,5],10,[8,0,2],6,[5,0,1],['43%','14%','.333','.000']),
          'brynna-peter':(6,'83%','80%','75%','0%','.500','.667','17%',18,[15,0,3,4],5,[4,0,1],2,[1,1,0],['0%','33%','—','.000']),
          'claire-jack':(5,'84%','60%','100%','50%','.333','.600','20%',19,[16,0,3,3],5,[3,0,2],4,[4,0,0],['50%','50%','1.000','.000']),
          'hailey-marsh':(18,'95%','100%','82%','10%','.471','.500','39%',40,[38,0,2,30],15,[15,0,0],11,[9,0,2],['10%','0%','1.000','—']),
          'lakyn-farley':(9,'73%','75%','100%','60%','.250','.333','33%',31,[21,3,7,8],8,[6,0,2],5,[5,0,0],['60%','0%','.667','—']),
          'lydia-copeland':(16,'92%','86%','86%','14%','.250','.438','31%',51,[47,0,4,14],14,[12,0,2],7,[6,0,1],['14%','14%','1.000','1.000']),
          'maia-waddell':(20,'98%','100%','94%','0%','.316','.350','20%',40,[39,0,1,26],19,[19,0,0],8,[7,1,0],['0%','0%','—','—']),
          'makenna-whitaker':(8,'74%','75%','67%','20%','.375','.375','38%',21,[15,1,5,0],8,[6,0,2],3,[2,0,1],['20%','0%','1.000','—']),
          'maleah-pena':(8,'71%','62%','100%','0%','.286','.375','12%',24,[17,0,7,0],8,[5,0,3],2,[2,0,0],['0%','33%','—','.500']),
          'matti-hardy':(19,'74%','74%','94%','7%','.333','.368','16%',56,[40,3,13,4],19,[14,0,5],8,[7,1,0],['7%','20%','1.000','.000']),
          'megan-ryan':(18,'83%','89%','90%','9%','.267','.389','22%',72,[58,4,10,0],18,[16,0,2],10,[9,0,1],['9%','27%','1.000','.333']),
          'tayte-stepps':(11,'77%','60%','83%','38%','.100','.182','18%',41,[31,1,9,7],10,[6,0,4],6,[4,2,0],['38%','38%','.333','.000'])}

          def once(text,pat,fn,label):
              out,n=re.subn(pat,fn,text,count=1,flags=re.S)
              if n!=1: raise RuntimeError(f'{label}: {n}')
              return out

          for slug,v in S.items():
              pa,decision,first,two,hhb,avg,obp,k,dn,dc,fn,fc,tn,tc,hp=v
              p=Path(slug)/'index.html'; text=p.read_text(encoding='utf-8')
              text=text.replace('Updated Sept. 20, 2026','Updated Oct. 10, 2026').replace('Snapshot · Sept. 20, 2026','Snapshot · Oct. 10, 2026')
              text=once(text,r'HotB · (?:<span data-hit="PA">)?\d+(?:</span>)? PA',lambda _:f'HotB · <span data-hit="PA">{pa}</span> PA',slug+' PA')
              for metric,val in [('decision',decision),('hhb',hhb)]:
                  pat=rf'(<div class="scout-hit-tile scout-hit-red"[^>]*data-metric="{metric}"[^>]*>.*?<strong(?: data-hit="[^"]+")?>).*?(</strong>)'
                  text=once(text,pat,lambda m,val=val:m.group(1)+val+m.group(2),slug+' '+metric)
              pat=r'(<div class="scout-hit-tile scout-hit-red"[^>]*data-metric="aba"[^>]*>.*?<strong(?: data-hit="ABA")?>).*?(</strong>)'
              text=once(text,pat,lambda m:m.group(1)+f'<span style="font-size:.7em">1P {first}<br>2K {two}</span>'+m.group(2),slug+' aba')
              text=re.sub(r'aria-label="ABA:[^"]*"',f'aria-label="ABA: first pitch {first}, two-strike {two}. Open details"',text,count=1)
              for label,val in [('AVG',avg),('OBP',obp),('K%',k)]:
                  pat=rf'(<span[^>]*>{re.escape(label)}</span><strong(?: data-hit="[^"]+")?>)[^<]*(</strong>)'
                  text=once(text,pat,lambda m,val=val:m.group(1)+val+m.group(2),slug+' '+label)

              pat=r'(<div class="pc-decision-summary"><b(?: data-popup-value="decision")?>)[^<]*(</b><span>)\d+( scored decisions</span>)'
              text=once(text,pat,lambda m:m.group(1)+decision+m.group(2)+str(dn)+m.group(3),slug+' decision popup')
              text=once(text,r"\[\['Good',\d+\],\['Minor Poor',\d+\],\['Poor',\d+\],\['Not Scored',\d+\]\]",lambda _:f"[['Good',{dc[0]}],['Minor Poor',{dc[1]}],['Poor',{dc[2]}],['Not Scored',{dc[3]}]]",slug+' decision counts')
              text=once(text,r'<div class="pc-aba-summary"><div><b>[^<]+</b><span>1ST PITCH APPROACH</span></div><div><b>[^<]+</b><span>2-STRIKE APPROACH</span></div></div>',lambda _:f'<div class="pc-aba-summary"><div><b>{first}</b><span>1ST PITCH APPROACH</span></div><div><b>{two}</b><span>2-STRIKE APPROACH</span></div></div>',slug+' ABA popup')
              arr=[f"[['GOOD',{fc[0]}],['MINOR',{fc[1]}],['POOR',{fc[2]}]]",f"[['GOOD',{tc[0]}],['MINOR',{tc[1]}],['POOR',{tc[2]}]]"]; pos=[0]
              def ac(_): r=arr[pos[0]];pos[0]+=1;return r
              text,n=re.subn(r"\[\['GOOD',\d+\],\['MINOR',\d+\],\['POOR',\d+\]\]",ac,text,count=2)
              if n!=2: raise RuntimeError(slug+' ABA counts')
              text=re.sub(r'1P: \d+ scored first pitches · 2K: \d+ plate appearances that reached two strikes\. Good = full credit · Minor = half credit · Poor = zero\. (?:September 20, 2026|October 16, 2026) HotB backup\.',f'1P: {fn} scored first pitches · 2K: {tn} plate appearances that reached two strikes. Good = full credit · Minor = half credit · Poor = zero. October 16, 2026 HotB backup.',text,count=1)
              text=text.replace('September 20, 2026 HotB backup.','October 16, 2026 HotB backup.')

              pairs=f"[['HHB%','{hp[0]}'],['WEAK%','{hp[1]}'],['AVG ON HHB','{hp[2]}'],['AVG ON WEAK','{hp[3]}']]"
              text,n=re.subn(r"\[\['HHB%','[^']*'\],\['WEAK%','[^']*'\],\['AVG ON HHB','[^']*'\],\['AVG ON WEAK','[^']*'\]\]",pairs,text,count=1)
              if n==0:
                  vals=','.join(repr(x) for x in hp)
                  pat=r"(\['HHB%','WEAK%','AVG ON HHB','AVG ON WEAK'\]\.map\(\(label,i\)=>'<div class=\"pc-hhb-stat\"><b>'\+\[)[^\]]+(\]\[i\])"
                  text=once(text,pat,lambda m:m.group(1)+vals+m.group(2),slug+' HHB popup')
              text=re.sub(r'(class="data-note">[^<]*HotB game data )(?:from Sept\. 20, 2026|through Oct\. 10, 2026)',lambda m:m.group(1)+'through Oct. 10, 2026',text,count=1)
              text=re.sub(r'(class="pc-note">Calculated from [^<]*saved HotB game data )(?:from September 20, 2026|through October 10, 2026)',lambda m:m.group(1)+'through October 10, 2026',text,count=1)
              p.write_text(text,encoding='utf-8')
              check=p.read_text(encoding='utf-8')
              need=[decision,f'1P {first}<br>2K {two}',hhb,avg,obp,k,f'>{pa}</span> PA']
              if not all(x in check for x in need): raise RuntimeError(slug+' verification')
          PY
      - name: Commit updated stats
        run: |
          git config user.name "Rebels Scout Updater"
          git config user.email "actions@users.noreply.github.com"
          git add aniesa-rohleder brooklyn-gering brynna-peter claire-jack hailey-marsh lakyn-farley lydia-copeland maia-waddell makenna-whitaker maleah-pena matti-hardy megan-ryan tayte-stepps
          git diff --cached --quiet && exit 0
          git commit -m "Refresh Rebels Scout hitting stats from Oct 16 HotB backup"
          git push
