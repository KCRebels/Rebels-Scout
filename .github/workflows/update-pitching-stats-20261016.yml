name: Update Rebels Scout pitching stats once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-pitching-stats-20261016.yml"

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update pitching stat tiles
        run: python tools/update_pitching_stats_20261016.py
      - name: Commit updated pitcher pages
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aniesa-rohleder/index.html brooklyn-gering/index.html lakyn-farley/index.html makenna-whitaker/index.html megan-ryan/index.html
          git diff --cached --check
          git commit -m "Refresh Rebels Scout pitching stats from Oct 16 HotB backup"
          git push
